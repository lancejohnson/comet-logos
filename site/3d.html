<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comet: 3D video brochure</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=block" rel="stylesheet">
<script src="../logos.js"></script><script src="../logos2.js"></script><script src="../logos3.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#fff;color:#111;font:400 17px/1.5 Archivo,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.review{position:sticky;top:0;z-index:20;background:#111;color:#fff;font-size:13px;display:flex;gap:18px;align-items:center;padding:8px 16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.review .g{display:flex;gap:4px;align-items:center}.review .g>span{color:#888;margin-right:4px}
.review button{color:#ccc;border:1px solid #333;border-radius:999px;padding:4px 10px;font-size:13px}
.review button.on{background:#fff;color:#111;border-color:#fff}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;font-size:15px;color:#777}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 36px}
.stage{position:relative;width:100%;max-width:1100px;height:min(60vh,600px);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%!important;height:100%!important}
.hint{white-space:nowrap;position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:13px;color:#999;transition:opacity .6s;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:14px}
h1{font:700 26px/1.3 Archivo;letter-spacing:-.01em;margin-top:6px}
.ctas{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px;margin-top:22px}
.cta{border:1px solid #111;border-radius:4px;padding:12px 18px;font-size:16px;font-weight:500;text-align:center}
.cta.primary{border-color:#2F4BFF;color:#2F4BFF}
#track{width:100%;display:flex;flex-direction:column;align-items:center}
.cap{position:absolute;left:0;right:0;bottom:34px;font:700 22px/1.25 Archivo;letter-spacing:-.01em;color:#111;opacity:0;transition:opacity .35s;pointer-events:none}
.scrub{width:100%;max-width:560px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:4px 0 8px}
.scrub[hidden]{display:none}
.scrub button{font-size:13px;border:1px solid #ccc;border-radius:4px;padding:5px 10px;min-width:62px}
.scrub input{flex:1;accent-color:#111}
.steps{width:100%;display:flex;justify-content:space-between;font-size:12px;color:#999;padding-left:76px}
.steps span.on{color:#111}
body.v-scroll #track{height:420vh;justify-content:flex-start}
body.v-scroll .stage{position:sticky;top:44px;height:calc(100vh - 60px);max-height:none;touch-action:pan-y}
body.v-scroll .cap{opacity:1}
body.v-scroll main{justify-content:flex-start}
@media(max-width:600px){.steps{padding-left:0}.cap{font-size:19px}nav{padding:16px 18px}.stage{height:46vh}h1{font-size:21px}.ctas{max-width:none}}
</style>

</head><body>
<div class="review" id="review"><b>Comet 3D brochure</b>
 <div class="g" id="views"><span>View</span></div>
 <div class="g" id="brands"><span>Design</span></div>
 <div class="g"><button id="toggle">Replay</button><button id="spin">Auto-turn</button></div>
</div>
<nav><span data-logo="ss_clean" data-size="22" data-accent="#2F4BFF" data-ink="#0F1222"></span><a>(804) 506-3291</a></nav>
<main>
 <div id="track"><div class="stage" id="stage"><div class="loading" id="loading">Loading…</div><div class="hint" id="hint">Drag to turn. Tap to open or close.</div><div class="cap" id="cap"></div></div>
 <div class="scrub" id="scrub" hidden><button id="play" aria-label="Pause">Pause</button><input type="range" id="range" min="0" max="1000" value="0"><div class="steps" id="steps"></div></div></div>
 <h1>Video brochures, designed and priced online.</h1>
 <div class="ctas"><a class="cta primary" href="index.html#btn=square">Get Pricing</a><a class="cta" href="index.html#btn=square">Design Your Own</a></div>
</main>
<script src="3d.js"></script>
