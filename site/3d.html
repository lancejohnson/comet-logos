<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comet: 3D video brochure</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=block" rel="stylesheet">
<script src="../logos.js"></script><script src="../logos2.js"></script><script src="../logos3.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#fff;color:#111;font:400 17px/1.5 Archivo,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.review{position:sticky;top:0;z-index:20;background:#111;color:#fff;font-size:13px;display:flex;gap:18px;align-items:center;padding:8px 16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.review .g{display:flex;gap:4px;align-items:center}.review .g>span{color:#888;margin-right:4px}
.review button{color:#ccc;border:1px solid #333;border-radius:999px;padding:4px 10px;font-size:13px}
.review button.on{background:#fff;color:#111;border-color:#fff}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;font-size:15px;color:#777}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 36px}
.stage{position:relative;width:100%;max-width:980px;height:min(58vh,560px);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%!important;height:100%!important}
.hint{white-space:nowrap;position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:13px;color:#999;transition:opacity .6s;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:14px}
h1{font:700 26px/1.3 Archivo;letter-spacing:-.01em;margin-top:6px}
.ctas{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px;margin-top:22px}
.cta{border:1px solid #111;border-radius:4px;padding:12px 18px;font-size:16px;font-weight:500;text-align:center}
.cta.primary{border-color:#2F4BFF;color:#2F4BFF}
@media(max-width:600px){nav{padding:16px 18px}.stage{height:46vh}h1{font-size:21px}.ctas{max-width:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<div class="review" id="review"><b>Comet 3D brochure test</b>
 <div class="g"><span>Design</span><button data-d="0" class="on">Cloud software</button><button data-d="1">Healthcare</button><button data-d="2">Car launch</button></div>
 <div class="g"><span>Brochure</span><button id="toggle">Close</button><button id="spin" class="on">Auto-turn</button></div>
</div>
<nav><span data-logo="ss_clean" data-size="22" data-accent="#2F4BFF" data-ink="#0F1222"></span><a>(804) 506-3291</a></nav>
<main>
 <div class="stage" id="stage"><div class="loading" id="loading">Loading 3D brochure…</div><div class="hint" id="hint">Drag to turn. Tap to open or close.</div></div>
 <h1>Video brochures, designed and priced online.</h1>
 <div class="ctas"><a class="cta primary" href="index.html#btn=square">Get Pricing</a><a class="cta" href="index.html#btn=square">Design Your Own</a></div>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- size of a 7-inch brochure, in centimetres ----------
const W=21, D=14.8, BASE=0.75, COVER=0.28;      // closed size 21 × 14.8 cm
const SW=15.4, SH=8.7;                           // 7-inch 16:9 screen
const SCREEN_Z=-1.3;                             // screen sits above the buttons

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.9;

const camera=new THREE.PerspectiveCamera(30,1,1,400);
camera.position.set(14,17,40);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,5,-1);controls.enableDamping=true;controls.enablePan=false;
controls.minDistance=26;controls.maxDistance=80;controls.maxPolarAngle=Math.PI*0.47;controls.minPolarAngle=Math.PI*0.12;
controls.autoRotate=true;controls.autoRotateSpeed=0.6;

// key light with soft shadow
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-8,40,22);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.radius=14;key.shadow.blurSamples=24;key.shadow.bias=-0.0006;
Object.assign(key.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:90});scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff,0xdedad4,0.35));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:0.11}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// soft contact shadow right under the brochure
const cs=document.createElement('canvas');cs.width=cs.height=256;{const g=cs.getContext('2d');const r=g.createRadialGradient(128,128,10,128,128,128);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256)}
const contact=new THREE.Mesh(new THREE.PlaneGeometry(W*1.25,D*1.35),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cs),transparent:true,depthWrite:false}));
contact.rotation.x=-Math.PI/2;contact.position.y=0.02;scene.add(contact);

// ---------- artwork, drawn in the browser (stand-in designs, fictional brands) ----------
const PX=96; // pixels per cm
const art=(w,h,draw)=>{const c=document.createElement('canvas');c.width=Math.round(w*PX);c.height=Math.round(h*PX);const g=c.getContext('2d');g.scale(PX,PX);
 const ft=g.fillText.bind(g),mt=g.measureText.bind(g);g.fillText=(t,x,y)=>{g.save();g.scale(1/PX,1/PX);ft(t,x*PX,y*PX);g.restore()};g.measureText=t=>({width:mt(t).width/PX});
 draw(g,w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const font=(g,wt,size)=>g.font=`${wt} ${Math.round(size*PX)}px Archivo, sans-serif`;
const DESIGNS=[
 {name:'Northwind',tag:'Cloud data platform',bg:['#0E1A4F','#2F4BFF'],ink:'#fff',accent:'#7FE3FF',paper:'#F7F8FC',head:'Every team, one view of your data.',url:'northwind.example'},
 {name:'Halcyon Health',tag:'Care, wherever you are',bg:['#FFEDE3','#FF8A65'],ink:'#2A1410',accent:'#D9461E',paper:'#FFFAF6',head:'Care that travels with your patients.',url:'halcyon.example'},
 {name:'APEX',tag:'The all-electric GT',bg:['#0B0B0C','#26262A'],ink:'#fff',accent:'#FFB423',paper:'#141416',head:'0 to 60 in 3.1 seconds. Zero emissions.',url:'apex.example'},
];
function grad(g,w,h,d,angle=0){const l=g.createLinearGradient(0,h,w,0);l.addColorStop(0,d.bg[0]);l.addColorStop(1,d.bg[1]);g.fillStyle=l;g.fillRect(0,0,w,h)}
function mark(g,x,y,s,d){g.fillStyle=d.accent;g.beginPath();g.arc(x+s*.5,y+s*.5,s*.5,0,7);g.fill();g.globalAlpha=.5;g.beginPath();g.arc(x+s*.5,y+s*.5,s*.9,0,7);g.strokeStyle=d.accent;g.lineWidth=s*.08;g.stroke();g.globalAlpha=1}
function wrap(g,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const wd of words){const t=line?line+' '+wd:wd;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=wd}else line=t}g.fillText(line,x,y);return y}
function frontArt(d){return art(W,D,(g,w,h)=>{grad(g,w,h,d);
 g.globalAlpha=.18;g.fillStyle=d.accent;g.beginPath();g.arc(w*.86,h*.12,8.5,0,7);g.fill();g.beginPath();g.arc(w*.95,h*.95,5,0,7);g.fill();g.globalAlpha=1;
 mark(g,1.4,1.3,0.9,d);g.fillStyle=d.ink;font(g,700,0.62);g.fillText(d.name,2.7,2.0);
 font(g,800,1.75);g.fillStyle=d.ink;wrap(g,d.head,1.4,7.2,13.5,1.9);
 font(g,500,0.55);g.globalAlpha=.75;g.fillText(d.tag+'  ·  '+d.url,1.4,h-1.3);g.globalAlpha=1})}
function backArt(d){return art(W,D,(g,w,h)=>{g.fillStyle=d.bg[0];g.fillRect(0,0,w,h);mark(g,w/2-0.7,h/2-1.6,1.4,d);g.fillStyle=d.ink;font(g,700,0.8);g.textAlign='center';g.fillText(d.name,w/2,h/2+1.3);font(g,400,0.45);g.globalAlpha=.6;g.fillText(d.url,w/2,h/2+2.2)})}
function insideLeftArt(d){return art(W,D,(g,w,h)=>{g.fillStyle=d.paper;g.fillRect(0,0,w,h);  // inside of the base, under the screen
 const dark=d.paper<'#8';
 g.fillStyle=dark?'#fff':'#111';font(g,800,1.0);let y=wrap(g,'Why teams choose '+d.name,1.4,2.3,11,1.15);
 font(g,400,0.48);g.globalAlpha=.72;wrap(g,'Stand-in copy for the mockup. In the real designer this panel is written from your website: what you do, who it is for, and the one thing to remember.',1.4,y+0.95,10.8,0.72);g.globalAlpha=1;
 ['3×','42%','24/7'].forEach((n,i)=>{g.fillStyle=d.accent;font(g,800,1.25);g.fillText(n,14,2.6+i*3.7);g.fillStyle=dark?'#fff':'#111';g.globalAlpha=.6;font(g,400,0.42);g.fillText(['faster setup','lower cost','support'][i],14,3.3+i*3.7);g.globalAlpha=1});
})}
function insideRightArt(d){return art(W,D,(g,w,h)=>{grad(g,w,h,d);  // inside of the cover, around the screen
 g.fillStyle=d.ink;g.globalAlpha=.8;font(g,500,0.42);g.textAlign='center';
 ['Intro','Product','Customers','Pricing','Contact'].forEach((t,i)=>g.fillText(t,w/2+(i-2)*3.2,h-0.55));g.globalAlpha=1})}

// ---------- the video on the screen: an animated stand-in, drawn every frame ----------
const vc=document.createElement('canvas');vc.width=1280;vc.height=720;const vg=vc.getContext('2d');
const videoTex=new THREE.CanvasTexture(vc);videoTex.colorSpace=THREE.SRGBColorSpace;
let design=DESIGNS[0],vt0=performance.now();
function drawVideo(t){const d=design,s=((t-vt0)/1000)%12,W2=1280,H2=720;
 const l=vg.createLinearGradient(0,H2,W2,0);l.addColorStop(0,d.bg[0]);l.addColorStop(1,d.bg[1]);vg.fillStyle=l;vg.fillRect(0,0,W2,H2);
 for(let i=0;i<6;i++){const a=t/1600+i;vg.globalAlpha=.16;vg.fillStyle=d.accent;vg.beginPath();vg.arc(W2*(.15+.14*i)+Math.sin(a)*60,H2*.5+Math.cos(a*1.3)*170,90+40*Math.sin(a*.7),0,7);vg.fill()}
 vg.globalAlpha=Math.min(1,s/1.2);vg.fillStyle=d.ink;vg.font='800 78px Archivo, sans-serif';vg.fillText(s<6?d.name:d.tag,90,330);
 vg.font='400 36px Archivo, sans-serif';vg.globalAlpha*=.8;vg.fillText(s<6?'Your video plays here':d.url,92,395);vg.globalAlpha=1;
 vg.fillStyle='rgba(255,255,255,.25)';vg.fillRect(90,640,1100,6);vg.fillStyle='#fff';vg.fillRect(90,640,1100*(s/12),6);
 vg.font='500 26px Archivo, sans-serif';vg.fillStyle='rgba(255,255,255,.85)';vg.fillText(`0:${String(Math.floor(s)).padStart(2,'0')} / 0:12`,90,620);
 videoTex.needsUpdate=true}

// ---------- materials ----------
const paperEdge=new THREE.MeshPhysicalMaterial({color:0xf3f2ee,roughness:.75,sheen:.4,sheenRoughness:.8});
const printMat=(map,{gloss=0}={})=>new THREE.MeshPhysicalMaterial({map,roughness:gloss?.32:.62,clearcoat:gloss,clearcoatRoughness:.25});
const mats={front:printMat(null,{gloss:.35}),back:printMat(null),inL:printMat(null),inR:printMat(null)};

// ---------- geometry: landscape, hinged on the long back edge, screen inside the cover ----------
const brochure=new THREE.Group();scene.add(brochure);
const plane=(w,h,m)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
const up=m=>{m.rotation.x=-Math.PI/2;return m}, down=m=>{m.rotation.x=Math.PI/2;return m};
const base=new THREE.Mesh(new RoundedBoxGeometry(W,BASE,D,4,0.12),paperEdge);base.position.y=BASE/2;base.castShadow=base.receiveShadow=true;brochure.add(base);
const inBase=up(plane(W-0.06,D-0.06,mats.inL));inBase.position.y=BASE+0.002;inBase.receiveShadow=true;brochure.add(inBase);
const back=down(plane(W-0.06,D-0.06,mats.back));back.position.y=-0.002;brochure.add(back);
const hinge=new THREE.Group();hinge.position.set(0,BASE,-D/2);brochure.add(hinge);
const cover=new THREE.Group();cover.position.set(0,COVER/2+0.01,D/2);hinge.add(cover);
const coverBox=new THREE.Mesh(new RoundedBoxGeometry(W,COVER,D,4,0.1),paperEdge);coverBox.castShadow=coverBox.receiveShadow=true;cover.add(coverBox);
const front=up(plane(W-0.06,D-0.06,mats.front));front.position.y=COVER/2+0.002;cover.add(front);
const inCover=down(plane(W-0.06,D-0.06,mats.inR));inCover.position.y=-COVER/2-0.002;cover.add(inCover);
const SZ=0.75; // screen sits a little above centre when open
const bezel=new THREE.Mesh(new RoundedBoxGeometry(SW+0.6,0.08,SH+0.6,2,0.04),new THREE.MeshPhysicalMaterial({color:0x08080a,roughness:.3,clearcoat:1,clearcoatRoughness:.05}));
bezel.position.set(0,-COVER/2-0.04,SZ);bezel.castShadow=true;cover.add(bezel);
const screen=down(plane(SW,SH,new THREE.MeshBasicMaterial({map:videoTex,toneMapped:false})));screen.position.set(0,-COVER/2-0.085,SZ);cover.add(screen);
const glass=down(plane(SW+0.5,SH+0.5,new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.06,roughness:.03,clearcoat:1,envMapIntensity:2})));glass.position.set(0,-COVER/2-0.09,SZ);cover.add(glass);
const btnMat=new THREE.MeshPhysicalMaterial({color:0xE4E4E8,roughness:.35,clearcoat:.7});
for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.05,32),btnMat);b.position.set((i-2)*3.2,-COVER/2-0.025,-D/2+1.25);cover.add(b)}
const glow=new THREE.PointLight(0x9fb4ff,0,22,2);glow.position.set(0,BASE+6,0);brochure.add(glow);

function setDesign(i){design=DESIGNS[i];vt0=performance.now();
 for(const [k,fn] of [['front',frontArt],['back',backArt],['inL',insideLeftArt],['inR',insideRightArt]]){mats[k].map?.dispose();mats[k].map=fn(design);mats[k].needsUpdate=true}
 glow.color.set(design.bg[1])}

// ---------- opening animation ----------
let angle=0,target=0;const OPEN=Math.PI*0.585;
const toggleBtn=document.getElementById('toggle');
function setOpen(o){target=o?OPEN:0;toggleBtn.textContent=o?'Close':'Open'}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let pdown=null;
renderer.domElement.addEventListener('pointerdown',e=>{pdown=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{if(!pdown||Math.hypot(e.clientX-pdown[0],e.clientY-pdown[1])>5)return;
 const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
 if(ray.intersectObject(brochure,true).length)setOpen(target===0)});
controls.addEventListener('start',()=>{document.getElementById('hint').style.opacity=0});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
 camera.fov=w<600?40:30;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();

const clock=new THREE.Clock();
renderer.setAnimationLoop(t=>{const dt=Math.min(clock.getDelta(),.05);
 angle+=(target-angle)*Math.min(1,dt*3.2);hinge.rotation.x=-angle;
 const o=angle/OPEN;glow.intensity=40*o;screen.material.color.setScalar(0.25+0.75*o);
 if(o>0.05)drawVideo(t);
 controls.update();renderer.render(scene,camera)});

// review toolbar
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));setDesign(+b.dataset.d)});
toggleBtn.onclick=()=>setOpen(target===0);
const spin=document.getElementById('spin');spin.onclick=()=>{controls.autoRotate=!controls.autoRotate;spin.classList.toggle('on',controls.autoRotate)};

await document.fonts.ready;setDesign(0);drawVideo(performance.now());
document.getElementById('loading').remove();
setTimeout(()=>setOpen(true),600);
window.__ready=true;
</script>
</body></html>
